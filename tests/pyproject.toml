[project]
name = "grok-transformer-test-harness"
version = "0.1.0"
description = "Empirical test harness for repeatable strings, tokenization, hashing and deduplication on Grok-1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "TheAstrographer" }
]
dependencies = [
    # Keep minimal – add only what you actually import
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

pythonpath = ["."]
